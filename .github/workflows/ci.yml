name: CI
on:
  push:
  pull_request:

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in comment) so a
      # retagged/malicious release cannot silently run in the supply chain.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: pip install -r backend/requirements-test.txt
      # Correctness lint (ruff.toml): undefined names, unused imports, syntax
      # errors — the class of bug that shipped as the `job_id` NameError.
      - run: ruff check backend/app backend/tests
      - run: python -m compileall -q backend/app
      - run: pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npx tsc --noEmit
      - working-directory: web
        run: npm run build

  # Supply-chain audit (Change Set 0, C0.8): fails the build on any known
  # vulnerability in the shipped dependency trees. Both commands are run
  # locally before merge and are expected to be green; Dependabot PRs
  # (see .github/dependabot.yml) keep the pins moving.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      # Resolves the pinned runtime requirements transitively from PyPI
      # metadata (no wheel downloads) and fails on known CVEs.
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Production dependency tree only; dev deps (tests/lint) are not shipped.
      - working-directory: web
        run: npm audit --omit=dev
