# Correctness-first lint bar for CI (Change Set 0, C0.8).
#
# Selects ruff's historical default rules — pyflakes (F), pycodestyle
# import/statement errors (E4/E7/E9). This is deliberately NOT a style
# straitjacket: B008 (function-call defaults) conflicts with FastAPI's
# `Depends(...)` idiom, and the broader B/S/UP/SIM sets are left for a
# future cleanup pass. The goal here is CI catching real defects such as
# undefined names (F821 — the `job_id`/`file_id` bug), unused imports
# (F401) and syntax errors (E9xx).
target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Tests may use star-imports and unused names for fixtures/monkeypatching.
"backend/tests/**" = ["F401", "F403", "F405"]
